name: Tienda cada hora (bot, diseños, productos y pedidos)

on:
  schedule:
    - cron: "41 * * * *"      # cada hora, en el minuto 41
  workflow_dispatch:
  push:
    paths:
      - "disenos/**"
      - "data/suppliers/**"
      - "assets/verified/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tienda
  cancel-in-progress: false

jobs:
  tienda:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
      PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
      PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      INTERESTPRINT_APPKEY: ${{ secrets.INTERESTPRINT_APPKEY }}
      INTERESTPRINT_APPSECRET: ${{ secrets.INTERESTPRINT_APPSECRET }}
      INTERESTPRINT_STOREID: ${{ secrets.INTERESTPRINT_STOREID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 0. Herramientas para fotos (FFmpeg y Pillow)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow

      - name: 1. Leer lo que me mandaste al bot (productos, diseños y exportación de Shopify)
        run: python scripts/telegram_inbox.py

      - name: 1b. Mudanza desde Shopify (por tandas, con lectura de guías de tallas)
        run: python scripts/shopify_import.py

      - name: 1c. Copiar a la web las fotos que siguen en Shopify (por tandas)
        run: python scripts/mirror_shopify_images.py

      - name: 1d. Estudio de diseño (crea diseños propios nuevos cada día)
        run: python scripts/design_studio.py

      - name: 2. Convertir diseños nuevos en productos de Printify
        run: python scripts/design_factory.py

      - name: 3. Motor de la tienda (catálogo, precios, secciones, enlaces de pago)
        run: python scripts/autonomous_store_engine.py

      - name: 3a. Vigilante (revisa y corrige errores solo)
        continue-on-error: true
        run: python scripts/vigilante.py

      - name: 3b. Páginas de producto y catálogos para Google, Bing, Pinterest, Meta y TikTok
        run: python scripts/feeds_and_pages.py

      - name: 3c. Publicar en Instagram y Facebook (2 veces al día)
        continue-on-error: true
        run: python scripts/meta_publisher.py

      - name: 4. Enviar los pedidos nuevos a los talleres
        run: python scripts/order_router.py

      - name: 5. Guardar cambios
        run: |
          git config user.name "dpf-bot"
          git config user.email "dpf-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Tienda: actualización automática"
          git pull --rebase -q || true
          git push

  publicar:
    needs: tienda
    uses: ./.github/workflows/publicar-web.yml
