name: Motor diario DPF

on:
  schedule:
    - cron: "17 5 * * *"   # todos los días a las 05:17 UTC (06:17 en España en invierno)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tienda
  cancel-in-progress: false

jobs:
  motor:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
      PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
      PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1. Motor autónomo (productos, precios, campañas, cupones, orden, etiquetas)
        run: python scripts/autonomous_store_engine.py

      - name: 1b. Páginas de producto y catálogos para Google, Bing, Pinterest, Meta y TikTok
        run: python scripts/feeds_and_pages.py

      - name: 2. Informe diario por Telegram
        run: python scripts/daily_report.py

      - name: 3. Correo diario y bienvenidas con cupón
        run: python scripts/daily_fashion_mailer.py

      - name: 4. Guardar cambios
        run: |
          git config user.name "dpf-bot"
          git config user.email "dpf-bot@users.noreply.github.com"
          git add -A data assets disenos p feeds policies contact sitemap.xml robots.txt
          git diff --cached --quiet && exit 0
          git commit -m "Motor diario: catálogo actualizado"
          git pull --rebase -q || true
          git push

      - name: 5. Preparar FFmpeg y tipografía de la marca
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/CormorantGaramond.ttf \
            "https://github.com/google/fonts/raw/main/ofl/cormorantgaramond/CormorantGaramond%5Bwght%5D.ttf" || true

      - name: 6. Fábrica de contenido para TikTok, Instagram y Threads
        run: python scripts/social_media_factory.py

      - name: 7. Guardar el paquete de redes (descargable 7 días en Actions)
        uses: actions/upload-artifact@v4
        with:
          name: redes-dpf
          path: out/social/
          retention-days: 7
          if-no-files-found: ignore

  publicar:
    needs: motor
    uses: ./.github/workflows/publicar-web.yml
