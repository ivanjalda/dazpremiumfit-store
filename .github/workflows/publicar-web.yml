name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Preparar solo lo que ve el cliente (más ligero y rápido)
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'scripts' --exclude 'data/suppliers' --exclude '__pycache__' \
            --exclude '*.py' --exclude 'out'
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Si GitHub falla al publicar, esperar y reintentar
        if: steps.deploy.outcome == 'failure'
        run: sleep 90

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
